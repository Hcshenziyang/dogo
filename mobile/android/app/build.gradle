plugins { id 'com.android.application' }

def dogoLocal = new Properties()
def dogoLocalFile = rootProject.file('local.properties')
if (dogoLocalFile.isFile()) dogoLocalFile.withInputStream { dogoLocal.load(it) }
def dogoDefaultServer = dogoLocal.getProperty('dogo.defaultServer', '').trim()

android {
    namespace 'app.dogo.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'app.dogo.mobile'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.2.0'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', groovy.json.JsonOutput.toJson(dogoDefaultServer)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
            resValue 'string', 'app_name', 'DogO Dev'
        }
        release { resValue 'string', 'app_name', 'DogO' }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            systemProperty 'dogo.apiUrl', System.getProperty('dogo.apiUrl', '')
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
