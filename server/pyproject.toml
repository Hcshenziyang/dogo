[project]
name = "dogo-server"
version = "0.1.0"
description = "DogO personal memo and device delivery service"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.16,<2",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.9,<1",
]

[project.scripts]
dogo = "dogo_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 15

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
