<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DogO · 个人工作空间原型</title>
<style>
:root {
  color-scheme: light;
  --page:#f4f3f1; --sidebar:#f7f6f4; --paper:#fff; --ink:#272431;
  --muted:#8c8994; --soft:#b5b1bb; --line:#ebe9ee; --accent:#7660c8;
  --accent-deep:#604bb2; --accent-soft:#f1edf9; --accent-mid:#e4ddf7;
  --green:#469a78; --green-bg:#edf8f2; --red:#b96770; --red-bg:#fff1f1;
  --shadow:0 18px 50px rgba(42,34,62,.12);
  font-family: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; }
body { background:var(--page); color:var(--ink); font-size:14px; overflow:hidden; }
button,input,textarea { font:inherit; }
button { cursor:pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [contenteditable="true"]:focus-visible { outline:2px solid #9b8bd9; outline-offset:2px; }
button { color:inherit; }
.icon { width:17px; height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.small-icon { width:15px; height:15px; }
.app { height:100%; min-width:0; display:grid; grid-template-columns:232px minmax(0,1fr); grid-template-rows:58px minmax(0,1fr); background:var(--paper); }
.topbar { grid-column:1 / -1; display:flex; align-items:center; border-bottom:1px solid var(--line); min-width:0; background:#fff; z-index:4; }
.brand { height:100%; width:232px; flex:none; display:flex; align-items:center; gap:10px; padding:0 18px; border-right:1px solid var(--line); }
.brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:10px; color:white; background:linear-gradient(145deg,#a897e6,#7255bc); box-shadow:0 3px 8px #876dcc30; }
.brand-mark .icon { width:17px; height:17px; stroke-width:2.1; }
.brand-name { font-weight:700; letter-spacing:-.4px; font-size:16px; }
.brand-sub { font-size:10px; letter-spacing:1.3px; color:#b2aeb8; margin-left:2px; font-weight:500; }
.top-content { display:flex; flex:1; min-width:0; align-items:center; justify-content:space-between; padding:0 23px; gap:12px; }
.breadcrumb { display:flex; align-items:center; gap:9px; color:#a6a2ad; white-space:nowrap; min-width:0; font-size:12px; }
.breadcrumb strong { color:#615d6a; font-weight:600; overflow:hidden; text-overflow:ellipsis; }
.top-actions { display:flex; align-items:center; gap:14px; }
.mode-switch { background:#f4f3f6; padding:3px; border-radius:9px; display:flex; gap:1px; white-space:nowrap; }
.mode-switch button { border:0; background:none; color:#8d8995; padding:6px 10px; border-radius:7px; display:flex; align-items:center; gap:6px; font-size:11px; line-height:1; }
.mode-switch button.active { color:#4b435f; background:white; box-shadow:0 1px 4px #25203312; font-weight:600; }
.mode-switch .icon { width:14px; height:14px; }
.demo-pill { border:1px solid #e9e3f3; color:#8375ab; border-radius:99px; padding:5px 8px; font-size:10px; white-space:nowrap; background:#fcfaff; }
.avatar { width:27px; height:27px; border-radius:50%; display:grid; place-items:center; color:#70649b; background:#eae6f5; font-size:11px; font-weight:700; }
.sidebar { grid-column:1; grid-row:2; background:var(--sidebar); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; padding:17px 11px 12px; overflow:hidden; }
.side-label { display:flex; align-items:center; justify-content:space-between; color:#aba7b2; font-size:10px; font-weight:700; letter-spacing:.11em; padding:0 9px; margin:17px 0 8px; }
.side-label:first-child { margin-top:1px; }
.side-action { border:0; background:transparent; color:#aaa5b0; display:grid; place-items:center; padding:3px; border-radius:5px; }
.side-action:hover { background:#ebe9ef; color:#625c70; }
.nav-btn,.file-btn { border:0; background:transparent; width:100%; min-width:0; display:flex; align-items:center; gap:10px; color:#75717d; text-align:left; border-radius:8px; padding:9px 10px; font-size:12px; }
.nav-btn:hover,.file-btn:hover { background:#efedf2; color:#4a4456; }
.nav-btn.active,.file-btn.active { color:var(--accent-deep); background:#eae5f5; font-weight:600; }
.nav-btn .count { margin-left:auto; color:#b1acb7; font-size:10px; }
.nav-btn.active .count { color:#a195c8; }
.new-chat { margin:0 0 6px; border:1px solid #e8e4ed; border-radius:9px; background:#fff; display:flex; align-items:center; justify-content:center; gap:8px; padding:9px 10px; color:#5e5869; font-size:12px; font-weight:600; box-shadow:0 2px 5px #3b2e4507; }
.new-chat:hover { border-color:#c9bde9; color:var(--accent-deep); }
.sidebar-scroll { overflow-y:auto; min-height:0; }
.workspace-row { display:flex; align-items:center; gap:2px; border-radius:7px; }
.workspace-row:hover { background:#efedf2; }
.workspace-name { flex:1; min-width:0; border:0; background:transparent; display:flex; align-items:center; gap:7px; padding:8px 7px; text-align:left; color:#716a78; font-size:11.5px; font-weight:600; }
.workspace-name .icon { width:14px; height:14px; color:#a196ab; }
.workspace-name .workspace-chevron { width:11px; height:11px; color:#b6aeb9; }
.workspace-name span { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.workspace-add { border:0; background:transparent; color:#aaa1ad; padding:5px; border-radius:5px; display:grid; place-items:center; }
.workspace-add:hover { background:#e6e1ea; color:#725db1; }
.workspace-add .icon { width:14px; height:14px; }
.workspace-thread { padding-left:29px; }
.ungrouped-label { color:#aaa3ad; font-size:10px; padding:10px 10px 4px; }
.folder-row { display:flex; align-items:center; gap:8px; padding:8px 9px 5px; color:#9994a0; font-size:11px; font-weight:600; }
.folder-row .chevron { width:12px; height:12px; color:#b4b0ba; }
.file-btn { padding:8px 8px 8px 28px; font-size:11.5px; gap:8px; }
.file-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-btn .icon { width:15px; height:15px; color:#a69bbd; }
.file-btn.active .icon { color:var(--accent); }
.side-bottom { margin-top:auto; border-top:1px solid #e9e7eb; padding:12px 5px 0; display:flex; gap:9px; align-items:center; min-width:0; }
.side-bottom-icon { width:30px; height:30px; border-radius:9px; background:#ece9f1; color:#8b8298; display:grid; place-items:center; }
.side-bottom-main { flex:1; min-width:0; }
.side-bottom-main strong { display:block; font-size:11px; font-weight:600; color:#625d69; }
.side-bottom-main small { display:block; margin-top:3px; font-size:10px; color:#aaa5af; }
.stage { grid-column:2; grid-row:2; display:flex; min-width:0; min-height:0; background:#fff; }
.split { display:flex; width:100%; min-width:0; min-height:0; }
.chat-pane,.work-pane { display:flex; flex-direction:column; min-width:0; min-height:0; }
.chat-pane { flex:1 1 58%; background:#fff; }
.work-pane { flex:0 0 41%; border-left:1px solid var(--line); background:#fcfbfa; }
.split[data-focus="work"] .work-pane { order:0; flex:1 1 64%; border-left:0; }
.split[data-focus="work"] .chat-pane { order:1; flex:0 0 36%; border-left:1px solid var(--line); }
.pane-header { min-height:54px; flex:none; border-bottom:1px solid var(--line); padding:0 21px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:rgba(255,255,255,.9); }
.pane-title { display:flex; align-items:center; gap:9px; min-width:0; }
.pane-title strong { font-size:12px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pane-title .pane-icon { color:#9b8db8; }
.pane-subtitle { font-size:10px; color:#aaa4b0; margin-left:2px; white-space:nowrap; }
.header-actions { display:flex; align-items:center; gap:5px; }
.icon-button { background:none; border:0; padding:6px; color:#a5a0ab; border-radius:7px; display:grid; place-items:center; }
.icon-button:hover { background:#f3f0f7; color:var(--accent-deep); }
.text-button { border:0; background:none; padding:7px 8px; color:#928a9f; font-size:11px; display:flex; align-items:center; gap:5px; border-radius:7px; white-space:nowrap; }
.text-button:hover { color:var(--accent-deep); background:#f4f0f9; }
.chat-scroll { min-height:0; flex:1; overflow-y:auto; padding:24px 36px 20px; }
.chat-inner { max-width:680px; margin:0 auto; }
.date-divider { text-align:center; color:#c1bdc5; font-size:10px; margin-bottom:18px; }
.message { display:flex; gap:12px; margin-bottom:19px; align-items:flex-start; }
.message.user { flex-direction:row-reverse; }
.message-avatar { flex:none; width:29px; height:29px; border-radius:10px; background:#f1ecfa; color:#8069bf; display:grid; place-items:center; }
.message-avatar .icon { width:15px; height:15px; }
.message.user .message-avatar { background:#f0eef2; color:#89828e; font-size:10px; font-weight:700; border-radius:50%; }
.message-body { min-width:0; max-width:89%; }
.message-name { display:flex; align-items:center; gap:7px; font-weight:650; font-size:11px; color:#5a5562; margin:2px 0 9px; }
.message-name small { color:#c0bbc5; font-size:10px; font-weight:400; }
.message.user .message-name { justify-content:flex-end; }
.user-bubble { background:#f4f2f7; padding:12px 15px; border-radius:13px 3px 13px 13px; color:#504b58; font-size:12px; line-height:1.8; }
.assistant-text { font-size:12.5px; line-height:1.8; color:#5b5663; }
.user-quote { margin-bottom:8px; padding:5px 8px; border-left:2px solid #c8b8e9; color:#8d809c; background:#fdfbff; border-radius:0 5px 5px 0; font-size:10px; white-space:pre-wrap; }
.assistant-text p { margin:0 0 9px; }
.assistant-text p:last-child { margin-bottom:0; }
.assistant-text strong { color:#3f3948; font-weight:650; }
.source-title { color:#a39cab; font-size:10px; display:flex; align-items:center; gap:5px; margin:15px 0 7px; }
.sources { display:flex; gap:6px; flex-wrap:wrap; }
.source-chip { border:1px solid #eeeaf2; border-radius:6px; background:#fff; color:#807590; display:flex; gap:5px; align-items:center; padding:5px 7px; font-size:10px; }
.source-chip:hover { border-color:#cabde8; color:var(--accent-deep); }
.source-chip .icon { width:12px; height:12px; }
.answer-list { display:grid; gap:7px; padding:0; margin:10px 0 13px; list-style:none; }
.answer-list li { display:flex; gap:8px; align-items:flex-start; }
.answer-list .dot { width:5px; height:5px; border-radius:50%; background:#ab9ad7; margin-top:9px; flex:none; }
.result-card { margin-top:13px; width:100%; border:1px solid #eae5f3; background:linear-gradient(110deg,#fcfaff,#fff); border-radius:10px; padding:11px 12px; display:flex; align-items:center; gap:10px; text-align:left; }
.result-card:hover { border-color:#cfc2eb; }
.result-icon { width:31px; height:31px; flex:none; display:grid; place-items:center; border-radius:9px; background:#f0eafb; color:#8069c3; }
.result-content { flex:1; min-width:0; }
.result-content strong { display:block; color:#575062; font-size:11px; font-weight:650; }
.result-content small { display:block; color:#a29bab; font-size:10px; margin-top:4px; line-height:1.4; }
.result-action { color:#8f7bbc; font-size:10px; white-space:nowrap; }
.composer-wrap { flex:none; padding:5px 30px 15px; background:#fff; }
.composer-inner { max-width:680px; margin:0 auto; }
.quick-actions { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 9px; }
.quick { display:flex; align-items:center; gap:5px; border:1px solid #eeebf1; border-radius:7px; background:#fff; color:#928c99; padding:6px 8px; font-size:10px; }
.quick:hover { border-color:#d9cdee; color:#7661b4; }
.quick .icon { width:13px; height:13px; }
.composer { border:1px solid #e8e3ed; border-radius:13px; background:#fff; padding:10px 10px 8px; box-shadow:0 5px 16px #44315108; }
.composer:focus-within { border-color:#c4b5e1; box-shadow:0 3px 15px #8872c111; }
.composer textarea { width:100%; display:block; border:0; outline:0; resize:none; background:transparent; min-height:38px; max-height:120px; color:#50495c; font-size:12px; line-height:1.6; padding:2px 3px; }
.composer textarea::placeholder { color:#bbb6c0; }
.composer-bottom { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.composer-tools { display:flex; align-items:center; gap:6px; min-width:0; }
.composer-chip { border:0; background:#f6f3fa; color:#8a7aaa; padding:5px 7px; border-radius:6px; font-size:10px; display:flex; align-items:center; gap:4px; max-width:200px; }
.composer-chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.composer-chip .icon { width:12px; height:12px; }
.composer-chip.off { background:#f6f6f6; color:#aaa5ae; }
.model-text { color:#b3adb9; font-size:10px; white-space:nowrap; }
.send-button { width:28px; height:28px; border:0; border-radius:8px; display:grid; place-items:center; color:#fff; background:#8c78cf; }
.send-button:hover { background:#7561b9; }
.send-button .icon { width:15px; height:15px; }
.composer-note { color:#beb9c2; text-align:center; font-size:9.5px; margin-top:8px; }
.work-pane .pane-header { background:#fdfcfb; }
.work-tabs { display:flex; gap:2px; min-width:0; overflow:hidden; }
.work-tab { max-width:165px; display:flex; align-items:center; gap:6px; padding:8px 9px; border:0; background:transparent; color:#a6a0ab; border-radius:7px; font-size:10.5px; white-space:nowrap; }
.work-tab span { overflow:hidden; text-overflow:ellipsis; }
.work-tab.active { background:#f1eef5; color:#625776; }
.work-tab .icon { width:14px; height:14px; flex:none; }
.work-scroll { flex:1; overflow:auto; min-height:0; }
.document { max-width:680px; margin:0 auto; padding:46px clamp(25px,6vw,60px) 55px; }
.doc-kicker { display:flex; align-items:center; gap:7px; color:#aaa1ad; font-size:10px; margin-bottom:15px; }
.doc-kicker .dot { width:5px; height:5px; background:#bbaed9; border-radius:50%; }
.doc-title { margin:0 0 9px; font-size:24px; line-height:1.35; letter-spacing:-.7px; font-weight:700; color:#35303b; outline:none; overflow-wrap:anywhere; }
.doc-summary { margin:0 0 29px; color:#a09aa6; font-size:11.5px; line-height:1.75; outline:none; overflow-wrap:anywhere; }
.doc-divider { height:1px; background:#eeecee; margin-bottom:28px; }
.doc-body h2 { font-size:13px; color:#514a58; margin:0 0 11px; font-weight:700; }
.doc-body p { font-size:12px; line-height:1.95; color:#77717c; margin:0 0 25px; outline:none; white-space:pre-wrap; overflow-wrap:anywhere; }
.doc-body p:focus,.doc-title:focus,.doc-summary:focus { background:#fbf9ff; border-radius:4px; }
.doc-list { display:grid; gap:11px; margin:0 0 27px; }
.check-row { display:flex; align-items:flex-start; gap:9px; color:#77717c; font-size:11.5px; line-height:1.6; }
.check-row input,.task-item input { accent-color:#8d79ce; width:14px; height:14px; margin:2px 0 0; flex:none; cursor:pointer; }
.check-row.done span,.task-item.done .task-label { color:#b9b4be; text-decoration:line-through; }
.doc-tip { display:flex; gap:8px; align-items:flex-start; border-left:2px solid #c8b8e9; background:#f8f5fc; color:#8c80a2; font-size:10.5px; line-height:1.7; padding:10px 12px; border-radius:0 6px 6px 0; }
.tip-quote { border:0; background:transparent; color:#806abb; padding:0; font-size:10.5px; font-weight:600; }
.tip-quote:hover { color:#5f49ad; text-decoration:underline; }
.doc-tip { flex-wrap:wrap; }
.doc-footer { display:flex; align-items:center; gap:6px; margin-top:32px; color:#b5aebb; font-size:10px; }
.doc-footer .icon { width:13px; height:13px; }
.saved-dot { width:5px; height:5px; background:#83b69c; border-radius:50%; }
.canvas-container { height:100%; min-height:350px; position:relative; overflow:hidden; background-color:#faf9fb; background-image:radial-gradient(#e6e2eb 1px,transparent 1px); background-size:19px 19px; }
.canvas-toolbar { position:absolute; z-index:2; left:16px; top:16px; display:flex; gap:5px; }
.canvas-tool,.canvas-zoom button { border:1px solid #eae6ed; background:#fff; color:#827b8b; border-radius:7px; padding:7px 8px; display:flex; align-items:center; gap:5px; font-size:10px; box-shadow:0 2px 8px #3c304908; }
.canvas-tool:hover,.canvas-zoom button:hover { color:var(--accent-deep); border-color:#d8ccef; }
.canvas-tool .icon { width:13px; height:13px; }
.canvas-world { position:absolute; inset:55px 10px 55px; transform-origin:center; }
.canvas-lines { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
.canvas-node { position:absolute; transform:translate(-50%,-50%); width:clamp(84px, 27%, 160px); background:white; border:1px solid #e7e1ef; border-radius:10px; padding:10px 10px 9px; box-shadow:0 5px 16px #3e335412; touch-action:none; user-select:none; cursor:grab; }
.canvas-node:active { cursor:grabbing; }
.canvas-node.root { background:#f4effc; border-color:#d8c8f0; }
.canvas-node.connect-source { border-color:#8f72d0; box-shadow:0 0 0 3px #dbcef2; }
.canvas-tool.is-connecting { color:#6f55ad; border-color:#beaae3; background:#f6f1fd; }
.node-kicker { color:#a89db0; display:flex; align-items:center; gap:4px; font-size:9px; margin-bottom:7px; }
.node-kicker .icon { width:11px; height:11px; }
.node-title { font-size:10.5px; font-weight:650; line-height:1.5; color:#605669; white-space:normal; overflow-wrap:anywhere; }
.node-title[contenteditable] { cursor:text; user-select:text; }
.node-sub { margin-top:5px; color:#aaa2af; font-size:9px; line-height:1.5; }
.canvas-zoom { position:absolute; bottom:15px; right:15px; z-index:2; display:flex; gap:4px; align-items:center; }
.canvas-zoom span { font-size:10px; color:#a6a0ab; min-width:32px; text-align:center; }
.canvas-hint { position:absolute; left:18px; bottom:19px; color:#b4aeb8; font-size:10px; }
.project-view { max-width:690px; margin:0 auto; padding:32px clamp(22px,5vw,50px) 48px; }
.project-label { color:#aaa1ad; font-size:10px; margin-bottom:9px; }
.project-view h1 { margin:0 0 8px; font-size:20px; letter-spacing:-.5px; color:#3b3540; }
.project-description { color:#a29aa7; font-size:11px; line-height:1.7; margin:0 0 20px; }
.project-file-list { display:grid; gap:4px; margin-bottom:20px; }
.project-file { background:transparent; border:0; border-radius:7px; text-align:left; display:flex; gap:8px; align-items:center; padding:8px; color:#82798a; font-size:11px; }
.project-file .icon { width:14px; height:14px; color:#a597b7; }
.project-file.active,.project-file:hover { background:#f0ecf5; color:#705ba5; }
.project-preview { border:1px solid #ece8ee; border-radius:10px; background:#fff; overflow:hidden; }
.project-preview-head { border-bottom:1px solid #f0edf1; padding:11px 13px; display:flex; align-items:center; gap:7px; color:#817888; font-size:10px; }
.project-preview-head .icon { width:13px; height:13px; }
.project-preview pre { white-space:pre-wrap; overflow-wrap:anywhere; font:11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace; color:#716a78; margin:0; padding:14px; }
.project-notice { color:#aaa3ae; font-size:10px; line-height:1.7; margin-top:15px; }
.search-section { color:#aaa3ae; font-size:10px; font-weight:600; padding:9px 10px 3px; }
.tasks-view { max-width:650px; margin:0 auto; padding:40px clamp(24px,6vw,58px); }
.tasks-view h1 { font-size:22px; letter-spacing:-.6px; margin:0 0 8px; }
.tasks-view > p { color:#a09aa5; font-size:11px; line-height:1.7; margin:0 0 24px; }
.task-create { display:flex; gap:7px; margin-bottom:13px; }
.task-create input { min-width:0; flex:1; border:1px solid #eae6ed; border-radius:8px; padding:9px 10px; background:white; color:#625b67; font-size:11px; }
.task-create input::placeholder { color:#c0bac5; }
.task-create button { flex:none; border:1px solid #e4daef; border-radius:8px; background:#f8f4fc; color:#806ab2; padding:8px 10px; font-size:10px; }
.task-filter { display:flex; gap:5px; margin-bottom:20px; border-bottom:1px solid #edeaf0; }

.k-ai-message.user { margin-left:25px; background:#f2f5fa; border-radius:10px 10px 3px 10px; padding:10px 12px; color:#596473; white-space:pre-wrap; overflow-wrap:anywhere; }
.k-ai-who { color:#343c49; font-size:11px; font-weight:650; margin-bottom:6px; display:flex; align-items:center; gap:7px; }
.k-ai-who .icon { color:#7297dc; width:15px; height:15px; }
.k-ai-message p { margin:0 0 10px; }
.k-ai-quick { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.k-ai-quick button { border:1px solid #e6ebf3; background:#fafcff; color:#6682af; border-radius:7px; padding:6px 8px; font-size:10px; }
.k-proposal { width:100%; text-align:left; display:flex; align-items:center; gap:9px; border:1px solid #e8ecf2; border-radius:9px; background:#fff; color:#4d6388; padding:10px; }
.k-proposal:disabled { opacity:.55; cursor:default; }
.k-proposal:hover:enabled { background:#f8faff; }
.k-proposal .icon { color:#7397d4; }
.k-proposal strong,.k-proposal small { display:block; }
.k-proposal strong { font-size:11px; }
.k-proposal small { font-size:10px; color:#a0a8b2; margin-top:3px; }
.k-proposal > span:last-child { margin-left:auto; color:#8499b8; font-size:10px; white-space:nowrap; }
.k-quote { border-left:2px solid #aac1e7; color:#8593a7; padding-left:8px; font-size:10px; margin-bottom:6px; }
.k-ai-compose { flex:none; padding:10px 12px 14px; }
.k-context { font-size:10px; color:#929dab; padding:0 3px 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.k-context .icon { width:12px; height:12px; vertical-align:-2px; margin-right:3px; }
.k-context button { border:0; background:transparent; color:#7792bc; padding:0 3px; font-size:10px; }
.k-composer { border:1px solid #e3e7ec; border-radius:12px; padding:10px; box-shadow:0 5px 20px #20293908; }
.k-composer textarea { width:100%; min-height:52px; resize:vertical; border:0; outline:0; color:#515b69; font-size:12px; line-height:1.6; background:transparent; }
.k-composer textarea::placeholder { color:#bac0c9; }
.k-composer-bottom { display:flex; align-items:center; justify-content:space-between; color:#abb1ba; font-size:10px; }
.k-send { border:0; border-radius:50%; width:29px; height:29px; color:#fff; background:#8daef0; display:grid; place-items:center; }
.k-send .icon { width:15px; height:15px; }
.k-demo { text-align:center; font-size:10px; color:#bfc4cb; padding-top:7px; }
@media (max-width:1150px) and (min-width:761px) {
 .k-nav { flex-basis:155px; } .k-ai { flex-basis:270px; } .k-document { padding-left:28px; padding-right:28px; }
}
@media (max-width:760px) {
 .knowledge-entry { padding:0 7px; } .knowledge-entry .entry-label { display:none; }
 .knowledge-top { padding:0 10px; gap:7px; } .knowledge-top .k-breadcrumb { max-width:120px; }
 .k-mobile-button { display:inline-flex; } .k-nav { display:none; }
 .knowledge-view.show-tree .k-nav { display:flex; position:absolute; z-index:5; inset:0 auto 0 0; width:210px; box-shadow:8px 0 24px #0002; }
 .k-ai { display:none; } .knowledge-view.show-ai .k-ai { display:flex; position:absolute; z-index:6; inset:0 0 0 auto; width:min(345px,100%); box-shadow:-8px 0 24px #0002; }
 .k-ai-head .k-close-ai { display:grid; }
 .k-document { padding:35px 25px 55px; } .k-document .doc-title { font-size:25px; }
}

</style>

<script>
(function () {

  const defaults = {
    focus:'chat', section:'note', noteId:'workspace', taskFilter:'open', zoom:1, contextEnabled:true, quote:null,
    chatTitle:'从想法到工作台',
    notes: {
      workspace: { title:'个人 AI 工作台', subtitle:'让想法不止停留在聊天里。', overview:'一个把对话、笔记与可视化连接起来的个人空间。可以先和 AI 一起探索问题，也可以回到文档里认真写作。', principle:'对话可以引用已有笔记；AI 可以按需查找相关资料，与我一起梳理想法。', tasks:[
        {id:'task-1', text:'梳理笔记和对话之间的交互', done:false},
        {id:'task-2', text:'设计可以继续编辑的画布', done:false},

      ]},

    },
    nodes:[
      {id:'root',title:'个人 AI 工作台',sub:'一个连续的工作空间',x:50,y:16,type:'root'},
      {id:'chat',title:'对话与探索',sub:'讨论 · 提问 · 整理',x:20,y:49,type:'chat'},
      {id:'notes',title:'知识与待办',sub:'笔记 · 记录 · 行动',x:50,y:49,type:'note'},

      {id:'local',title:'本地知识库',sub:'内容由自己掌握',x:50,y:81,type:'folder'}

    edges:[['root','chat'],['root','notes'],['root','canvas'],['notes','local']],
    messages:[
      {kind:'user',text:'梳理一下我对个人 AI 工作台的想法，再画一张产品结构图。'},

      {kind:'proposal',status:'pending',noteId:'workspace'}

  let state;
  try { const saved = JSON.parse(localStorage.getItem(key) || 'null'); state = saved && saved.notes && saved.nodes && saved.messages ? Object.assign({}, defaults, saved) : structuredClone(defaults); }
  catch (_) { state = structuredClone(defaults); }
  if (!Array.isArray(state.threads) || !state.threads.length) { state.threadId='demo'; state.threads=[{id:'demo',title:state.chatTitle,messages:state.messages}]; }
  if (!state.threadId) state.threadId=state.threads[0].id;
  if (!Array.isArray(state.projects)) {
    state.projects=[{id:'dogo',name:'DogO',open:true},{id:'site',name:'示例网站',open:true}];
    state.threads.push(
      {id:'dogo-server',projectId:'dogo',title:'梳理服务端结构',section:'project',contextEnabled:true,messages:[{kind:'user',text:'帮我梳理一下这个项目的服务端结构。'},{kind:'project-intro'}]},
      {id:'dogo-plugin',projectId:'dogo',title:'整理插件改动',section:'project',contextEnabled:true,messages:[{kind:'user',text:'看看这个项目最近有哪些插件改动。'},{kind:'project-intro'}]},
      {id:'site-home',projectId:'site',title:'调整首页布局',section:'project',contextEnabled:true,messages:[{kind:'user',text:'帮我看看首页布局。'},{kind:'project-intro'}]}
    );
  }
  if (typeof state.contextEnabled !== 'boolean') state.contextEnabled=true;
  if (!Number.isFinite(state.uiVersion) || state.uiVersion<2) {
    const old=state.threads.find(function(t){return t.id===state.threadId;});

    state.threads.forEach(function(t){if(['dogo-server','dogo-plugin','site-home'].includes(t.id))t.section='guide';});
    state.threadId=initial.id;state.chatTitle=initial.title;state.messages=initial.messages||[];

  }
  if (typeof state.panelOpen!=='boolean') state.panelOpen=true;
  if (!Array.isArray(state.rightTabs)||!state.rightTabs.length) state.rightTabs=[state.section||'guide'];

  if (!Number.isFinite(state.workWidth)) state.workWidth=45;
  if (state.uiVersion!==3) {
    if (['note','canvas','tasks'].includes(state.section)) state.knowledgeView=state.section;
    state.knowledgeNoteId=state.noteId || 'workspace';
    state.threads.forEach(function(t){
      if (['note','canvas','tasks'].includes(t.section)) t.section='guide';
      if (Array.isArray(t.rightTabs)) { t.rightTabs=t.rightTabs.filter(function(x){return !['note','canvas','tasks'].includes(x);}); if(!t.rightTabs.length)t.rightTabs=['guide']; }
    });
    if (['note','canvas','tasks'].includes(state.section)) state.section='guide';
    state.rightTabs=state.rightTabs.filter(function(x){return !['note','canvas','tasks'].includes(x);});
    if(!state.rightTabs.length)state.rightTabs=['guide'];
    state.appMode='project';state.uiVersion=3;
  }
  if (!['project','knowledge'].includes(state.appMode)) state.appMode='project';
  if (!['note','canvas','tasks'].includes(state.knowledgeView)) state.knowledgeView='note';
  if (!state.notes[state.knowledgeNoteId]) state.knowledgeNoteId='workspace';
  if (!Array.isArray(state.knowledgeMessages)) state.knowledgeMessages=[];
  if (!state.knowledgeQuote) state.knowledgeQuote=null;
  let knowledgeActiveProposal=null;
  let searchScope='sessions';
  let activeProposal = null;
  let lastSelection = null;
  let connecting = false;
  let connectionStart = null;
  let toastTimer;
  const split = document.getElementById('split');
  const work = document.getElementById('work-content');
  const messages = document.getElementById('messages');
  const searchDialog = document.getElementById('search-dialog');
  const reviewDialog = document.getElementById('review-dialog');
  const newDialog = document.getElementById('new-dialog');
  const projectDialog = document.getElementById('project-dialog');
  const projectPicker = document.getElementById('project-picker');
  function currentThread() { return state.threads.find(function(t){return t.id===state.threadId;}); }
  function currentProject() { const t=currentThread(); return t && t.projectId ? state.projects.find(function(p){return p.id===t.projectId;}) : null; }
  function persist() {
    const thread=currentThread();
    if(thread){thread.title=state.chatTitle;thread.messages=state.messages;thread.section=state.section;thread.noteId=state.noteId;thread.contextEnabled=state.contextEnabled;thread.quote=state.quote;thread.projectFile=state.projectFile;thread.rightTabs=state.rightTabs.slice();thread.panelOpen=state.panelOpen;thread.panelFull=state.panelFull;}
    try { localStorage.setItem(key,JSON.stringify(state)); } catch (_) {}
  }
  function toast(text) { const t=document.getElementById('toast'); t.textContent=text; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2100); }
  function note() { return state.notes[state.noteId] || state.notes.workspace; }
  function focus(mode) {
    state.focus=mode; split.dataset.focus=mode;
    document.querySelectorAll('[data-action="focus-chat"],[data-action="focus-work"]').forEach(function (b) { const selected=b.dataset.action === 'focus-'+mode; b.classList.toggle('active',selected); b.setAttribute('aria-pressed',String(selected)); });
    updateNav(); renderThreads(); persist();
  }
  function activateSection(section) {
    if(!Array.isArray(state.rightTabs))state.rightTabs=[];
    if(!state.rightTabs.includes(section)) {
      const guideIndex=state.rightTabs.indexOf('guide');
      if(section!=='guide'&&state.section==='guide'&&guideIndex>=0)state.rightTabs.splice(guideIndex,1,section);
      else state.rightTabs.push(section);
    }
    state.section=section;state.panelOpen=true;
  }
  function openSection(section, makeFocus) {
    if (['note','canvas','tasks'].includes(section)) { showKnowledge(section); return; }
    activateSection(section);lastSelection=null;connecting=false;connectionStart=null;
    if (makeFocus) focus('work');
    renderWorkspace(); renderTabs(); updateNav(); persist();
  }
  function openNote(id, makeFocus) {
    if (!state.notes[id]) return;
    showKnowledge('note',id);
  }
  function updateNav() {
    const knowledge=['note','canvas','tasks'].includes(state.section);
    const context=state.quote?'摘录 · '+state.quote.title:state.section==='canvas'?'工作台结构':state.section==='tasks'?'待办事项':note().title;
    document.getElementById('context-chip').textContent=state.contextEnabled?context:'未关联内容';
    const chip=document.querySelector('[data-action="attach-current"]');
    chip.hidden=!knowledge&&!state.quote;
    chip.classList.toggle('off',!state.contextEnabled);chip.setAttribute('aria-pressed',String(state.contextEnabled));
    chip.title=state.quote?'移除选中的摘录':'切换当前内容引用';
    document.getElementById('chat-title').textContent=state.chatTitle;
    document.getElementById('work-pane').hidden=!state.panelOpen;
    document.getElementById('splitter').hidden=!state.panelOpen||!!state.panelFull;
    document.querySelector('[data-action="open-right"]').hidden=!!state.panelOpen;
    split.classList.toggle('panel-open',!!state.panelOpen);
    split.classList.toggle('fullscreen',!!state.panelFull&&!!state.panelOpen);
    split.style.setProperty('--work-width',state.workWidth+'%');
    const full=document.querySelector('[data-action="toggle-fullscreen"]');

    full.title=state.panelFull?'退出全屏':'全屏';
  }
  function renderThreads() {
    function rows(projectId) {
      return state.threads.filter(function(t){return (t.projectId||null)===projectId;}).map(function(t){
        return '<button type="button" class="file-btn workspace-thread '+(state.appMode==='project'&&state.threadId===t.id?'active':'')+'" data-thread="'+esc(t.id)+'">'+icon('chat')+'<span>'+esc(t.title)+'</span></button>';
      }).join('');
    }
    const groups=state.projects.map(function(p){
      return '<div class="workspace-row"><button type="button" class="workspace-name" data-toggle-project="'+esc(p.id)+'" aria-expanded="'+String(p.open!==false)+'">'+icon(p.open!==false?'down':'chevron','workspace-chevron')+icon('folder')+'<span>'+esc(p.name)+'</span></button><button type="button" class="workspace-add" data-new-project-thread="'+esc(p.id)+'" aria-label="在 '+esc(p.name)+' 新建对话" title="在此项目新建对话">'+icon('plus')+'</button></div>'+(p.open!==false?rows(p.id):'');
    }).join('');

    document.getElementById('thread-list').innerHTML=groups+(ungrouped?'<div class="ungrouped-label">未分组</div>'+ungrouped:'');
  }
  function renderProjectPicker() {
    function rows(projectId) {
      return state.threads.filter(function(t){return (t.projectId||null)===projectId;}).map(function(t){return '<button class="search-result" type="button" data-picker-thread="'+esc(t.id)+'">'+icon('chat')+'<span><strong>'+esc(t.title)+'</strong><small>示例对话</small></span></button>';}).join('');
    }
    document.getElementById('project-picker-content').innerHTML=state.projects.map(function(p){return '<div class="search-section">'+esc(p.name)+'</div>'+rows(p.id)+'<button class="search-result" type="button" data-picker-new="'+esc(p.id)+'">'+icon('plus')+'<span><strong>在此项目新建对话</strong></span></button>';}).join('')+'<div class="search-section">未分组</div>'+rows(null);
  }
  function openThread(id) {
    showProject();
    persist();
    const t=state.threads.find(function(x){return x.id===id;});

  function attachCanvasDrag(target) {
    target.querySelectorAll('.canvas-node').forEach(function(el){

        const rect=world.getBoundingClientRect(), startX=e.clientX, startY=e.clientY, x=n.x, y=n.y;
        el.setPointerCapture(e.pointerId);
        function move(ev){n.x=Math.max(12,Math.min(88,x+(ev.clientX-startX)/rect.width*100));n.y=Math.max(8,Math.min(92,y+(ev.clientY-startY)/rect.height*100));el.style.left=n.x+'%';el.style.top=n.y+'%';updateEdges();}
        function up(){el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);persist();}
        el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
      });
    });

    if(m.kind==='canvas-proposal') {
      const label=m.status==='applied'?'已应用修改':m.status==='rejected'?'已放弃建议':'查看建议';
      body='<div class="assistant-text"><p>我建议在画布中增加“引用与来源”，把知识库和对话之间的关系补充清楚。</p></div><button type="button" class="result-card" data-review="'+index+'" '+(m.status!=='pending'?'disabled':'')+'><span class="result-icon">'+icon('canvas')+'</span><span class="result-content"><strong>补充画布关系</strong><small>修改建议 · 工作台结构</small></span><span class="result-action">'+label+' '+(m.status==='pending'?'↗':'')+'</span></button>';
    }
    if(m.kind==='canvas')body='<div class="assistant-text"><p>我根据示例笔记整理了一张结构图。你可以在画布中拖动卡片，或者直接修改卡片标题。</p></div><button type="button" class="result-card" data-action="open-canvas"><span class="result-icon">'+icon('canvas')+'</span><span class="result-content"><strong>工作台结构</strong><small>示例画布 · 可继续编辑</small></span><span class="result-action">打开 ↗</span></button>';
    if(m.kind==='project-intro')body='<div class="assistant-text"><p>我会先查看项目目录，梳理服务端的主要模块、接口入口和它们之间的关系。</p><p>你也可以从右侧打开工作区文件，边看代码边继续讨论。</p></div>';
    if(m.kind==='project-generic')body='<div class="assistant-text"><p>这是预设的示例回复。实际使用时，这里继续使用 Harness 原有的项目会话和工具。</p></div>';
    if(m.kind==='generic')body='<div class="assistant-text"><p>这个原型暂时使用预设回复。你可以试试“完善当前笔记”或“画一张结构图”，看看内容与对话怎样配合。</p></div>';
    return '<div class="message"><span class="message-avatar">'+icon('spark')+'</span><div class="message-body"><div class="message-name">DogO <small>示例回复</small></div>'+body+'</div></div>';
  }
  function renderMessages(scroll) {
    messages.innerHTML='<div class="date-divider">今天 · 示例对话</div>'+state.messages.map(messageHtml).join('');
    if(scroll)requestAnimationFrame(function(){const c=document.getElementById('chat-scroll');c.scrollTop=c.scrollHeight;});
  }
  function proposalAfter(original) {
    const sentence='AI 修改已有内容前，先展示建议，由我确认后再应用。';
    return original.includes(sentence)?original:original+' '+sentence;
  }
  function showReview(index) {
    const proposal=state.messages[index]; if(!proposal || !['proposal','canvas-proposal'].includes(proposal.kind) || proposal.status!=='pending')return;
    activeProposal=index;
    if(proposal.kind==='canvas-proposal') {
      document.getElementById('review-title').textContent='补充画布关系';
      document.getElementById('review-desc').textContent='工作台结构 · 节点与连线';
      document.getElementById('review-before').textContent='现有“知识与待办”节点。';
      document.getElementById('review-after').textContent='新增“引用与来源”节点，并从“知识与待办”连接过去。';
    } else {
      const n=state.notes[proposal.noteId]||state.notes.workspace;
      document.getElementById('review-title').textContent='让协作原则更清晰';
      document.getElementById('review-desc').textContent=n.title+' · 协作原则';
      document.getElementById('review-before').textContent=n.principle;
      document.getElementById('review-after').textContent=proposalAfter(n.principle);
    }
    reviewDialog.showModal();
  }
  function completeReview(apply) {
    if(knowledgeActiveProposal!==null){
      const p=state.knowledgeMessages[knowledgeActiveProposal];
      if(!p||p.status!=='pending')return;
      const isCanvas=p.kind==='canvas-proposal';
      if(apply){
        if(isCanvas){if(!findNode('source')){state.nodes.push({id:'source',title:'引用与来源',sub:'连接对话和笔记',x:22,y:79,type:'note'});state.edges.push(['notes','source']);}state.knowledgeView='canvas';}
        else {const n=state.notes[p.noteId]||state.notes.workspace;n.principle=proposalAfter(n.principle);state.knowledgeNoteId=p.noteId;state.knowledgeView='note';}
        p.status='applied';
      }else p.status='rejected';
      knowledgeActiveProposal=null;reviewDialog.close();persist();renderKnowledge();toast(apply?'已应用示例建议':'已放弃修改建议');return;
    }
    if(activeProposal===null)return;
    const p=state.messages[activeProposal]; if(!p||p.status!=='pending')return;
    if(apply){
      if(p.kind==='canvas-proposal') {
        if(!findNode('source')){state.nodes.push({id:'source',title:'引用与来源',sub:'连接对话和笔记',x:22,y:79,type:'note'});state.edges.push(['notes','source']);}
        activateSection('canvas');
      } else {const n=state.notes[p.noteId]||state.notes.workspace;n.principle=proposalAfter(n.principle);state.noteId=p.noteId;activateSection('note');}
      p.status='applied';
    } else p.status='rejected';
    const isCanvas=p.kind==='canvas-proposal';activeProposal=null;reviewDialog.close();persist();renderWorkspace();renderTabs();renderMessages(false);
    toast(apply?(isCanvas?'建议已应用到示例画布':'建议已应用到示例笔记'):'已放弃修改建议');
  }
  function submitMessage(text) {
    const value=String(text||'').trim();if(!value)return;
    state.messages.push({kind:'user',text:value,quote:state.contextEnabled&&state.quote?Object.assign({},state.quote):null}); state.quote=null;
    if(state.chatTitle==='新的对话'||state.chatTitle==='新会话'){state.chatTitle=Array.from(value).slice(0,18).join('');renderThreads();}
    state.messages.push({kind:'project-generic'});
    document.getElementById('chat-input').value='';persist();renderThreads();renderMessages(true);updateNav();
  }
  function renderSearch() {
    const q=document.getElementById('search-input').value.trim().toLowerCase();
    const matchedThreads=state.threads.filter(function(t){
      const project=state.projects.find(function(p){return p.id===t.projectId;});
      const text=[t.title,project?project.name:'未分组'].concat((t.messages||[]).filter(function(m){return m.kind==='user';}).map(function(m){return m.text||'';})).join(' ').toLowerCase();
      return !q||text.includes(q);
    }).map(function(t){
      const project=state.projects.find(function(p){return p.id===t.projectId;});
      return '<button class="search-result" type="button" data-search-thread="'+esc(t.id)+'">'+icon('chat')+'<span><strong>'+esc(t.title)+'</strong><small>'+(project?esc(project.name):'未分组')+' · 示例对话</small></span></button>';
    });
    const matchedNotes=Object.entries(state.notes).filter(function(entry){const n=entry[1];return !q || [n.title,n.subtitle,n.overview,n.principle].join(' ').toLowerCase().includes(q);}).map(function(entry){return '<button class="search-result" type="button" data-search-note="'+esc(entry[0])+'">'+icon('note')+'<span><strong>'+esc(entry[1].title)+'</strong><small>'+esc(entry[1].subtitle)+'</small></span></button>';});
    if(!q || '工作台结构 canvas 画布'.includes(q))matchedNotes.push('<button class="search-result" type="button" data-search-canvas="1">'+icon('canvas')+'<span><strong>工作台结构</strong><small>画布 · 我的知识库</small></span></button>');
    const html=(searchScope!=='notes'&&matchedThreads.length?'<div class="search-section">工作区与会话</div>'+matchedThreads.join(''):'')+(searchScope==='notes'&&matchedNotes.length?'<div class="search-section">知识库</div>'+matchedNotes.join(''):'');
    document.getElementById('search-results').innerHTML=html||'<div class="search-empty">没有找到匹配的示例内容。</div>';
  }
  document.addEventListener('click',function(e){
    const knowledgeNoteButton=e.target.closest('[data-knowledge-note]');if(knowledgeNoteButton){showKnowledge('note',knowledgeNoteButton.dataset.knowledgeNote);return;}
    const knowledgeViewButton=e.target.closest('[data-knowledge-view]');if(knowledgeViewButton){showKnowledge(knowledgeViewButton.dataset.knowledgeView);return;}
    const knowledgeReview=e.target.closest('[data-knowledge-review]');if(knowledgeReview){showKnowledgeReview(Number(knowledgeReview.dataset.knowledgeReview));return;}
    const closeTab=e.target.closest('[data-close-right-tab]');
    if(closeTab){
      const name=closeTab.dataset.closeRightTab,index=state.rightTabs.indexOf(name);
      if(index>=0){state.rightTabs.splice(index,1);if(!state.rightTabs.length){state.rightTabs=['guide'];state.section='guide';state.panelOpen=false;}else if(state.section===name)state.section=state.rightTabs[Math.max(0,index-1)]||state.rightTabs[0];renderWorkspace();renderTabs();persist();}return;
    }
    const openTab=e.target.closest('[data-open-right-tab]');
    if(openTab){state.section=openTab.dataset.openRightTab;renderWorkspace();renderTabs();persist();return;}
    const pickerThread=e.target.closest('[data-picker-thread]');if(pickerThread){projectPicker.close();openThread(pickerThread.dataset.pickerThread);return;}
    const pickerNew=e.target.closest('[data-picker-new]');if(pickerNew){projectPicker.close();createThread(pickerNew.dataset.pickerNew);return;}
    const toggleProject=e.target.closest('[data-toggle-project]'); if(toggleProject){const p=state.projects.find(function(x){return x.id===toggleProject.dataset.toggleProject;});if(p){p.open=p.open===false;persist();renderThreads();}return;}
    const newProjectThread=e.target.closest('[data-new-project-thread]');if(newProjectThread){createThread(newProjectThread.dataset.newProjectThread);return;}
    const projectFile=e.target.closest('[data-project-file]');if(projectFile){if(!currentProject())return;state.projectFile=projectFile.dataset.projectFile;activateSection('project');renderWorkspace();renderTabs();persist();return;}
    const threadButton=e.target.closest('[data-thread]'); if(threadButton){openThread(threadButton.dataset.thread);return;}
    const canvasNode=e.target.closest('.canvas-node');if(canvasNode&&connecting){e.preventDefault();const id=canvasNode.dataset.node;if(!connectionStart){connectionStart=id;renderCanvas();toast('请选择连线的目标节点');}else if(connectionStart===id){toast('请选择另一个节点');}else{if(!state.edges.some(function(edge){return edge[0]===connectionStart&&edge[1]===id;}))state.edges.push([connectionStart,id]);connecting=false;connectionStart=null;persist();renderCanvas();toast('已连接两个节点');}return;}
    const noteButton=e.target.closest('[data-note]'); if(noteButton){openNote(noteButton.dataset.note,true);return;}
    const rev=e.target.closest('[data-review]'); if(rev){showReview(Number(rev.dataset.review));return;}
    const filter=e.target.closest('[data-filter]'); if(filter){state.taskFilter=filter.dataset.filter;persist();renderTasks();return;}
    const searchThread=e.target.closest('[data-search-thread]');if(searchThread){searchDialog.close();openThread(searchThread.dataset.searchThread);return;}
    const searchNote=e.target.closest('[data-search-note]');if(searchNote){searchDialog.close();openNote(searchNote.dataset.searchNote,true);return;}
    const searchCanvas=e.target.closest('[data-search-canvas]');if(searchCanvas){searchDialog.close();openSection('canvas',true);return;}
    const button=e.target.closest('[data-action]');if(!button)return;
    switch(button.dataset.action){
      case 'open-knowledge':showKnowledge(state.knowledgeView||'note');break;
      case 'return-project':showProject();break;
      case 'toggle-knowledge-tree':document.getElementById('knowledge-view').classList.toggle('show-tree');break;
      case 'toggle-knowledge-ai':document.getElementById('knowledge-view').classList.toggle('show-ai');break;
      case 'knowledge-summary':submitKnowledge('请帮我提炼当前内容的要点。','summary');break;
      case 'knowledge-improve':submitKnowledge(state.knowledgeView==='canvas'?'请帮我整理当前画布。':'请帮我完善当前内容。','proposal');break;
      case 'knowledge-quote':
        if(!lastSelection||lastSelection.noteId!==state.knowledgeNoteId){toast('请先选中笔记中的文字');break;}
        state.knowledgeQuote=Object.assign({},lastSelection);persist();renderKnowledgeContext();document.getElementById('knowledge-view').classList.add('show-ai');document.getElementById('knowledge-input').focus();toast('选中文字已加入 AI 对话');break;
      case 'clear-knowledge-quote':state.knowledgeQuote=null;persist();renderKnowledgeContext();break;
      case 'open-right':state.panelOpen=true;state.panelFull=false;renderWorkspace();renderTabs();updateNav();persist();break;
      case 'close-right':state.panelOpen=false;state.panelFull=false;focus('chat');break;
      case 'show-guide':openSection('guide',false);break;
      case 'toggle-fullscreen':state.panelOpen=true;state.panelFull=!state.panelFull;updateNav();persist();break;
      case 'open-project-files':openSection('project',true);break;
      case 'open-terminal':openSection('terminal',true);break;
      case 'host-only':toast('「'+(button.dataset.hostName||'此功能')+'」保留原有位置；原型中仅作展示');break;
      case 'toggle-sidebar':if(window.innerWidth<=760)document.body.classList.toggle('mobile-sidebar-open');else document.querySelector('.app').classList.toggle('sidebar-collapsed');break;
      case 'focus-chat':focus('chat');break;
      case 'focus-work':focus('work');break;
      case 'toggle-focus':focus(state.focus==='chat'?'work':'chat');break;
      case 'open-chat':focus('chat');break;
      case 'open-notes':openSection('note',true);break;
      case 'open-canvas':openSection('canvas',true);break;
      case 'open-tasks':openSection('tasks',true);break;
      case 'show-project':if(currentProject())openSection('project',false);break;
      case 'show-note':openSection('note',false);break;
      case 'show-canvas':openSection('canvas',false);break;
      case 'show-tasks':openSection('tasks',false);break;
      case 'open-session-search':searchScope='sessions';document.getElementById('search-input').placeholder='搜索工作区和会话…';document.getElementById('search-input').value='';renderSearch();searchDialog.showModal();setTimeout(function(){document.getElementById('search-input').focus();},20);break;
      case 'open-search':searchScope='notes';document.getElementById('search-input').placeholder='搜索知识库…';document.getElementById('search-input').value='';renderSearch();searchDialog.showModal();setTimeout(function(){document.getElementById('search-input').focus();},20);break;
      case 'close-search':searchDialog.close();break;
      case 'open-project-picker':renderProjectPicker();projectPicker.showModal();break;
      case 'close-project-picker':projectPicker.close();break;
      case 'new-project':if(projectPicker.open)projectPicker.close();document.getElementById('project-name').value='';projectDialog.showModal();setTimeout(function(){document.getElementById('project-name').focus();},20);break;
      case 'close-project-dialog':projectDialog.close();break;
      case 'new-note':document.getElementById('new-name').value='';newDialog.showModal();setTimeout(function(){document.getElementById('new-name').focus();},20);break;
      case 'close-new':newDialog.close();break;
      case 'close-review':activeProposal=null;knowledgeActiveProposal=null;reviewDialog.close();break;
      case 'reject-review':completeReview(false);break;
      case 'apply-review':completeReview(true);break;
      case 'quick-improve':submitMessage('请帮我完善当前笔记。');break;
      case 'quick-canvas':submitMessage('把这些想法画成一张结构图。');break;
      case 'canvas-improve':if(state.appMode==='knowledge'){submitKnowledge('请帮我整理当前画布。','proposal');break;}state.messages.push({kind:'user',text:'请帮我整理当前画布。'});state.messages.push({kind:'canvas-proposal',status:'pending'});persist();renderMessages(true);if(window.innerWidth<=760)focus('chat');break;
      case 'connect-node':connecting=!connecting;connectionStart=null;renderCanvas();if(connecting)toast('请选择连线的起点和目标');break;
      case 'quote-selection':if(!lastSelection||lastSelection.noteId!==state.noteId){toast('请先选中笔记中的文字');break;}state.quote=Object.assign({},lastSelection);state.contextEnabled=true;persist();updateNav();if(window.innerWidth<=760){state.panelOpen=false;focus('chat');}document.getElementById('chat-input').focus();toast('选中文字已加入对话');break;
      case 'zoom-in':state.zoom=Math.min(1.3,Math.round((state.zoom+.1)*10)/10);persist();renderCanvas();break;
      case 'zoom-out':state.zoom=Math.max(.7,Math.round((state.zoom-.1)*10)/10);persist();renderCanvas();break;
      case 'add-node':state.nodes.push({id:'node-'+Date.now(),title:'新想法',sub:'点击标题编辑',x:75,y:80,type:'note'});persist();renderCanvas();toast('已添加节点，可以直接编辑标题');break;
      case 'attach-current':if(state.section==='project'&&currentProject()){toast('当前对话属于「'+currentProject().name+'」项目');break;}if(state.quote){state.quote=null;toast('已移除选中的摘录');}else{state.contextEnabled=!state.contextEnabled;toast(state.contextEnabled?'已关联当前内容':'已移除当前内容');}persist();updateNav();break;
      case 'reset-demo':if(window.confirm('将清除这个原型中保存的演示改动，恢复初始示例。继续吗？')){try{localStorage.removeItem(key);}catch(_){}location.reload();}break;
      case 'new-chat':createThread(currentProject()?currentProject().id:null);break;
    }
    renderNoteList();
  });
  document.addEventListener('selectionchange',function(){
    const sel=window.getSelection();if(!sel||!sel.anchorNode||!sel.toString().trim())return;
    if(state.appMode==='knowledge'&&state.knowledgeView==='note'&&document.getElementById('knowledge-content').contains(sel.anchorNode))lastSelection={noteId:state.knowledgeNoteId,title:knowledgeNote().title,text:sel.toString().trim()};
    else if(state.appMode==='project'&&state.section==='note'&&work.contains(sel.anchorNode))lastSelection={noteId:state.noteId,title:note().title,text:sel.toString().trim()};
  });
  document.addEventListener('pointerdown',function(e){if(e.target.closest('[data-action="quote-selection"],[data-action="knowledge-quote"]'))e.preventDefault();});
  document.addEventListener('submit',function(e){if(e.target.id!=='task-form')return;e.preventDefault();const input=document.getElementById('task-input');const value=input.value.trim();if(!value)return;state.notes.workspace.tasks.push({id:'task-'+Date.now(),text:value,done:false});state.taskFilter='open';persist();renderTasks();updateNav();toast('待办已添加到示例笔记');});
  document.addEventListener('change',function(e){
    if(!e.target.matches('[data-task]'))return;
    const n=state.notes[e.target.dataset.taskNote]; const t=n&&(n.tasks||[]).find(function(item){return item.id===e.target.dataset.task;});
    if(!t)return;t.done=e.target.checked;persist();if(state.appMode==='knowledge'){renderKnowledgeMain();renderKnowledgeContext();}else{renderWorkspace();renderTabs();updateNav();}
  });
  document.addEventListener('input',function(e){
    const el=e.target;
    if(el.matches('[data-field]')) {
      const targetNote=state.appMode==='knowledge'?knowledgeNote():note();targetNote[el.dataset.field]=el.textContent;persist();
      const s=document.getElementById(state.appMode==='knowledge'?'knowledge-save-status':'save-status');if(s)s.textContent='示例内容已保存在本机';
      if(el.dataset.field==='title'){if(state.appMode==='knowledge'){renderKnowledgeTree();renderKnowledgeContext();}else{renderNoteList();renderTabs();}}
    }
    if(el.matches('[data-node-title]')){const n=findNode(el.dataset.nodeTitle);if(n){n.title=el.textContent;persist();}}
    if(el.id==='search-input')renderSearch();
  });
  document.getElementById('knowledge-form').addEventListener('submit',function(e){e.preventDefault();submitKnowledge(document.getElementById('knowledge-input').value);});
  document.getElementById('knowledge-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('knowledge-form').requestSubmit();}});
  document.getElementById('chat-form').addEventListener('submit',function(e){e.preventDefault();submitMessage(document.getElementById('chat-input').value);});
  document.getElementById('chat-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('chat-form').requestSubmit();}});
  document.getElementById('project-form').addEventListener('submit',function(e){
    e.preventDefault();const name=document.getElementById('project-name').value.trim();if(!name)return;
    const id='project-'+Date.now();state.projects.push({id:id,name:name,open:true});projectDialog.close();persist();createThread(id);
  });
  document.getElementById('new-form').addEventListener('submit',function(e){
    e.preventDefault();const title=document.getElementById('new-name').value.trim();if(!title)return;
    const id='note-'+Date.now();state.notes[id]={title:title,subtitle:'点击这里写下一句简介。',overview:'点击这里开始记录。',principle:'在这里写下你的想法。',tasks:[]};newDialog.close();persist();showKnowledge('note',id);toast('已创建示例笔记');
  });
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!searchDialog.open){searchScope='sessions';document.getElementById('search-input').placeholder='搜索工作区和会话…';document.getElementById('search-input').value='';renderSearch();searchDialog.showModal();document.getElementById('search-input').focus();}}});
  const splitter=document.getElementById('splitter');
  splitter.addEventListener('pointerdown',function(e){
    if(e.button!==0)return;splitter.setPointerCapture(e.pointerId);
    function move(ev){const rect=split.getBoundingClientRect();state.workWidth=Math.max(30,Math.min(70,(rect.right-ev.clientX)/rect.width*100));split.style.setProperty('--work-width',state.workWidth+'%');}
    function up(){splitter.removeEventListener('pointermove',move);splitter.removeEventListener('pointerup',up);splitter.removeEventListener('pointercancel',up);persist();}
    splitter.addEventListener('pointermove',move);splitter.addEventListener('pointerup',up);splitter.addEventListener('pointercancel',up);
  });
  splitter.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.workWidth=Math.max(30,Math.min(70,state.workWidth+(e.key==='ArrowLeft'?2:-2)));updateNav();persist();}});
  focus(state.focus==='work'?'work':'chat');renderWorkspace();renderTabs();renderMessages(false);renderThreads();updateNav();
  if(state.appMode==='knowledge')showKnowledge();else showProject();
})();
</script>
</body>
</html>
