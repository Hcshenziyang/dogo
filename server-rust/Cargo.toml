[package]
name = "dogo-memo-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.8", features = ["json", "query", "tokio", "http1"] }
base64 = "0.22.1"
diesel = { version = "2.3.14", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.9.2", features = ["sqlite", "bb8"] }
hex = "0.4.3"
jsonwebtoken = "9.3.1"
# Bundle SQLite so the same RETURNING support is available in the container.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
rand = "0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
