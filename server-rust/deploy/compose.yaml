services:
  dogo-memos:
    image: dogo-memos:20261112-9ca399a
    container_name: dogo-memos
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 384m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /etc/dogo-rust/registration.env
    volumes:
      - /var/lib/dogo-rust:/data
    ports:
      - "127.0.0.1:8788:8789"
